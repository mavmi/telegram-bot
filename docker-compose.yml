version: "3.8"

services:
  monitoring_telegram_bot:
    image: monitoring-telegram-bot-image:${TAG:-latest}
    container_name: monitoring-telegram-bot
    profiles: ["dev", "prod"]
    build:
      context: ./
      dockerfile: docker/monitoringTelegramBotDockerfile
    volumes:
      - monitoring_telegram_bot_volume:/volumes/monitoring-telegram-bot
    restart: always
    networks:
      - services_network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 6

  rocketchat_telegram_bot:
    image: rocketchat-telegram-bot-image:${TAG:-latest}
    container_name: rocketchat-telegram-bot
    profiles: ["dev", "prod"]
    build:
      context: ./
      dockerfile: docker/rocketchatTelegramBotDockerfile
    volumes:
      - rocketchat_telegram_bot_volume:/volumes/rocketchat-telegram-bot
    restart: always
    networks:
      - services_network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 6

  shakal_telegram_bot:
    image: shakal-telegram-bot-image:${TAG:-latest}
    container_name: shakal-telegram-bot
    profiles: ["dev", "prod"]
    build:
      context: ./
      dockerfile: docker/shakalTelegramBotDockerfile
    volumes:
      - shakal_telegram_bot_volume:/volumes/shakal-telegram-bot
    restart: always
    networks:
      - services_network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 6

  water_stuff_telegram_bot:
    image: water-stuff-telegram-bot-image:${TAG:-latest}
    container_name: water-stuff-telegram-bot
    profiles: ["dev", "prod"]
    build:
      context: ./
      dockerfile: docker/waterStuffTelegramBotDockerfile
    volumes:
      - water_stuff_telegram_bot_volume:/volumes/water-stuff-telegram-bot
    restart: always
    networks:
      - services_network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 6

volumes:
  monitoring_telegram_bot_volume:
    name: monitoring_telegram_bot_volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NFS}/services/telegram-bot/volumes/monitoring-telegram-bot

  rocketchat_telegram_bot_volume:
    name: rocketchat_telegram_bot_volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NFS}/services/telegram-bot/volumes/rocketchat-telegram-bot

  shakal_telegram_bot_volume:
    name: shakal_telegram_bot_volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NFS}/services/telegram-bot/volumes/shakal-telegram-bot

  water_stuff_telegram_bot_volume:
    name: water_stuff_telegram_bot_volume
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NFS}/services/telegram-bot/volumes/water-stuff-telegram-bot

networks:
  services_network:
    external: true
